<!doctype html>
<html lang="ja">
<head>
  <meta name="machi-api-origin" content="https://adsl-bill-williams-blocking.trycloudflare.com/">
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fbf9">
  <meta name="description" content="服屋に寄って、家を建てて、友達と街を育てるブラウザゲーム。">
  <title>まちのとなり</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.js"
      }
    }
  </script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <symbol id="i-town" viewBox="0 0 24 24"><path d="m3 11 6-5 6 5v8H3zM9 19v-4h2v4m4-9 3-3 4 4v8h-7"/><path d="M3 19h19"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 10-8 10s-8-5-8-10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="10" cy="8" r="3"/><path d="M4 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-15a3 3 0 0 1 0 6m3 9v-2a4 4 0 0 0-2-3.46"/></symbol>
      <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1m-7 8v3"/></symbol>
      <symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M9 9V6a3 3 0 0 1 6 0v6m-6 0a3 3 0 0 0 5.1 2.1M5 11v1a7 7 0 0 0 12 4.9M19 11v1c0 .8-.1 1.6-.4 2.3M12 19v3M3 3l18 18"/></symbol>
      <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m12 7 1.3 3.7L17 12l-3.7 1.3L12 17l-1.3-3.7L7 12l3.7-1.3z"/></symbol>
      <symbol id="i-guide" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.1 4.9-4.9 2.1 2.1-4.9z"/></symbol>
      <symbol id="i-shop" viewBox="0 0 24 24"><path d="M6 11v9h12v-9M3 11l2-6h14l2 6a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"/><path d="M10 20v-5h4v5"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-7 9 7m-16-1v10h14V10m-9 10v-6h4v6"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zm6-3v15m6-12v15"/></symbol>
      <symbol id="i-avatar" viewBox="0 0 24 24"><path d="m8 4-5 3 2 5 3-1v9h8v-9l3 1 2-5-5-3a4 4 0 0 1-8 0Z"/></symbol>
      <symbol id="i-expand" viewBox="0 0 24 24"><path d="M9 3H3v6m12-6h6v6m0 6v6h-6m-6 0H3v-6"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h15m-6-6 6 6-6 6"/></symbol>
    </defs>
  </svg>

  <svg width="0" height="0" aria-hidden="true" class="svg-library">
    <symbol id="i-shirt" viewBox="0 0 24 24"><path d="M9 4 4 6 2 11l4 2 2-3v10h8V10l2 3 4-2-2-5-5-2a3 3 0 0 1-6 0Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
    <symbol id="i-hat" viewBox="0 0 24 24"><path d="M7 12V9a5 5 0 0 1 10 0v3m-10 0h10c2.5.5 4 1.4 4 2.4C21 16 17 17 12 17s-9-1-9-2.6c0-1 1.5-1.9 4-2.4Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
  </svg>
  <div id="scene" aria-label="街の3Dマップ"></div>

  <header class="hud-header" aria-label="プレイヤーと街の情報">
    <div class="brand" aria-label="まちのとなり">
      <span class="brand-mark"><svg class="icon"><use href="#i-town"/></svg></span>
      <h1>まちのとなり</h1>
    </div>
    <div class="location-chip" title="現在地">
      <svg class="icon"><use href="#i-pin"/></svg><span id="location-label">ひだまり通り</span>
    </div>
    <div class="header-controls">
      <div class="coin-chip" title="所持コイン" aria-label="所持コイン">
        <svg class="icon"><use href="#i-coin"/></svg><strong id="balance">500</strong>
      </div>
      <button id="mic-button" class="header-button mic-button" type="button" data-action="mic" aria-pressed="false" title="マイクを切り替える">
        <svg class="icon mic-closed"><use href="#i-mic-off"/></svg><svg class="icon mic-open"><use href="#i-mic"/></svg><span id="mic-label">マイクオフ</span>
      </button>
      <button id="room-button" class="header-button room-button" type="button" data-action="room">
        <svg class="icon"><use href="#i-users"/></svg><span id="room-status">友達と遊ぶ</span>
      </button>
    </div>
  </header>

  <aside id="panel" class="side-panel" aria-label="ゲームメニュー">
    <header class="panel-header">
      <div id="panel-icon" class="panel-icon" aria-hidden="true"><svg class="icon"><use href="#i-guide"/></svg></div>
      <div class="panel-heading">
        <span id="panel-kicker" class="eyebrow">ひだまりの街</span>
        <h2 id="panel-title">まち案内</h2>
      </div>
      <button id="panel-toggle" class="icon-button panel-toggle" type="button" data-action="toggle-panel" aria-expanded="true" aria-label="メニューを開閉"><svg class="icon"><use href="#i-up"/></svg></button>
    </header>
    <div id="panel-content" class="panel-content">
      <p class="panel-intro">街を歩いて、服屋や空いている住宅地を探してみよう。</p>
      <div class="guide-list">
        <button class="guide-card" type="button" data-tab="shop"><span class="guide-icon blush"><svg class="icon"><use href="#i-shop"/></svg></span><span><strong>服屋</strong><small>試着して、新しい服を買う</small></span><svg class="icon guide-arrow"><use href="#i-arrow"/></svg></button>
        <button class="guide-card" type="button" data-tab="home"><span class="guide-icon mint"><svg class="icon"><use href="#i-home"/></svg></span><span><strong>家づくり</strong><small>自宅・共同住宅・別荘を建てる</small></span><svg class="icon guide-arrow"><use href="#i-arrow"/></svg></button>
        <button class="guide-card" type="button" data-tab="edit"><span class="guide-icon blue"><svg class="icon"><use href="#i-edit"/></svg></span><span><strong>街の編集</strong><small>建物と道路の場所を変える</small></span><svg class="icon guide-arrow"><use href="#i-arrow"/></svg></button>
      </div>
    </div>
  </aside>

  <div class="world-tools">
    <div id="view-bar" class="view-bar" aria-label="視点と階の切り替え"></div>
    <section class="map-card" aria-label="ミニマップ">
      <div class="map-header"><span><svg class="icon"><use href="#i-edit"/></svg> マップ</span><button class="icon-button" type="button" data-action="overview" aria-label="街全体を表示" title="街全体を表示"><svg class="icon"><use href="#i-expand"/></svg></button></div>
      <canvas id="minimap" width="150" height="100" aria-label="街の配置と現在地"></canvas>
    </section>
    <div class="movement-help" aria-label="操作方法"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>で移動・ドラッグで見回す・<kbd>V</kbd>で一人称</span></div>
    <div id="joystick" class="joystick" aria-label="移動スティック"><span></span></div>
  </div>

  <nav id="tabs" class="tabs" aria-label="ゲームメニュー">
    <button type="button" data-tab="guide" class="active" aria-pressed="true"><svg class="icon"><use href="#i-guide"/></svg><span>まち案内</span></button>
    <button type="button" data-tab="shop" aria-pressed="false"><svg class="icon"><use href="#i-shop"/></svg><span>服屋</span></button>
    <button type="button" data-tab="home" aria-pressed="false"><svg class="icon"><use href="#i-home"/></svg><span>家づくり</span></button>
    <button type="button" data-tab="edit" aria-pressed="false"><svg class="icon"><use href="#i-edit"/></svg><span>街の編集</span></button>
    <button type="button" data-tab="avatar" aria-pressed="false"><svg class="icon"><use href="#i-avatar"/></svg><span>アバター</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="dialog" class="game-dialog">
    <button class="icon-button dialog-close" type="button" data-action="close-dialog" aria-label="閉じる"><svg class="icon"><use href="#i-x"/></svg></button>
    <div id="dialog-content"></div>
  </dialog>

  <!-- If the 3D libraries cannot be fetched, say so instead of leaving an empty screen. -->
  <script type="module" src="./app.js?v=4" onerror="const toast = document.getElementById('toast'); toast.hidden = false; toast.textContent = '3D表示の部品を読み込めませんでした。通信環境を確認して、ページを読み込み直してください。'"></script>
</body>
</html>
